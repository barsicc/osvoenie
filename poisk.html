to_11] Распределение лицензионных участков на шельфе России (слайд 17)", "file": "01_lekcii.md", "text": "- Доли: **Роснефть 40,0%**, **Газпром 34,7%**, **Лукойл 8,3%**, остальные 17%."}, {"kind": "note", "title": "[photo_11] Распределение лицензионных участков на шельфе России (слайд 17)", "file": "01_lekcii.md", "text": "- Лицензионные обязательства недропользователя состоят из **трёх этапов**:"}, {"kind": "note", "title": "[photo_11] Распределение лицензионных участков на шельфе России (слайд 17)", "file": "01_lekcii.md", "text": "1. геолого-поисковые работы,"}, {"kind": "note", "title": "[photo_11] Распределение лицензионных участков на шельфе России (слайд 17)", "file": "01_lekcii.md", "text": "2. геолого-разведочные работы,"}, {"kind": "note", "title": "[photo_11] Распределение лицензионных участков на шельфе России (слайд 17)", "file": "01_lekcii.md", "text": "3. разработка, обустройство и добыча."}, {"kind": "note", "title": "[photo_12] Арктика", "file": "01_lekcii.md", "text": "- **Арктика** (от греч. ἀρκτικός — **медвежий**; относящийся к созвездию Большой Медведицы; северный) — северная полярная область Земли, включающая северные окраины материков Евразия и Северная Америка (кроме южной части о. Гренландия и п-ова Лабрадор), Северный Ледовитый океан (кроме восточной и южной частей Норвежского моря) с островами, а также прилегающие части Атлантического и Тихого океанов. (Большая российская энциклопедия)"}, {"kind": "note", "title": "[photo_13] Границы Арктики", "file": "01_lekcii.md", "text": "- Впервые Россия заявила о своих правах на арктические территории в **1916 году**."}, {"kind": "note", "title": "[photo_13] Границы Арктики", "file": "01_lekcii.md", "text": "- Границы Арктики определяются **не одним универсальным критерием, а их совокупностью**:"}, {"kind": "note", "title": "[photo_13] Границы Арктики", "file": "01_lekcii.md", "text": "- природно-климатические,"}, {"kind": "note", "title": "[photo_13] Границы Арктики", "file": "01_lekcii.md", "text": "- биологические,"}, {"kind": "note", "title": "[photo_13] Границы Арктики", "file": "01_lekcii.md", "text": "- политико-экономические,"}, {"kind": "note", "title": "[photo_13] Границы Арктики", "file": "01_lekcii.md", "text": "- юридические."}, {"kind": "note", "title": "[photo_13] Границы Арктики", "file": "01_lekcii.md", "text": "- Карта «Арктическая зона России»: арктические страны — Россия, Норвегия, Исландия, Дания (Гренландия), Канада, США; Северный полярный круг, Северный морской путь."}, {"kind": "note", "title": "[photo_14] Притязания стран на арктический шельф (слайд 20, источник: Российский совет по международным делам)", "file": "01_lekcii.md", "text": "- Претенденты: Россия, Канада, США, Дания (о. Гренландия), Норвегия, Исландия."}, {"kind": "note", "title": "[photo_14] Притязания стран на арктический шельф (слайд 20, источник: Российский совет по международным делам)", "file": "01_lekcii.md", "text": "- Спорные подводные структуры: **хребет Ломоносова** (проходит через Северный полюс, спор России, Дании, Канады), **поднятие Менделеева** (в секторе России)."}, {"kind": "note", "title": "[photo_14] Притязания стран на арктический шельф (слайд 20, источник: Российский совет по международным делам)", "file": "01_lekcii.md", "text": "- Острова на карте: Шпицберген, Новая Земля, Северная Земля, Новосибирские острова, о. Врангеля."}, {"kind": "note", "title": "[photo_15] Вечная мерзлота в России (фактор, осложняющий освоение морских месторождений)", "file": "01_lekcii.md", "text": "- Вечная мерзлота занимает **65% площади страны**."}, {"kind": "note", "title": "[photo_15] Вечная мерзлота в России (фактор, осложняющий освоение морских месторождений)", "file": "01_lekcii.md", "text": "- Типы: непрерывная (> 90%, мощность 200–1500 м), прерывистая (50–90%, 50–300 м), островная (< 50%, 1–100 м), сезонная."}, {"kind": "note", "title": "[photo_15] Вечная мерзлота в России (фактор, осложняющий освоение морских месторождений)", "file": "01_lekcii.md", "text": "- **Ключевые проблемы разработки ресурсов Арктики**:"}, {"kind": "note", "title": "[photo_15] Вечная мерзлота в России (фактор, осложняющий освоение морских месторождений)", "file": "01_lekcii.md", "text": "- **капитальные вложения** могут достигать миллиардов долларов;"}, {"kind": "note", "title": "[photo_15] Вечная мерзлота в России (фактор, осложняющий освоение морских месторождений)", "file": "01_lekcii.md", "text": "- **сезон навигации** длится слишком короткое время;"}, {"kind": "note", "title": "[photo_15] Вечная мерзлота в России (фактор, осложняющий освоение морских месторождений)", "file": "01_lekcii.md", "text": "- **вечная мерзлота** подтаивает и разрушает инфраструктуру;"}, {"kind": "note", "title": "[photo_15] Вечная мерзлота в России (фактор, осложняющий освоение морских месторождений)", "file": "01_lekcii.md", "text": "- **летнее время** открывает болотистый, труднопроходимый ландшафт;"}, {"kind": "note", "title": "[photo_15] Вечная мерзлота в России (фактор, осложняющий освоение морских месторождений)", "file": "01_lekcii.md", "text": "- **зимнее время** — морозы до −50 °C и ниже, ураганные ветра и снег;"}, {"kind": "note", "title": "[photo_15] Вечная мерзлота в России (фактор, осложняющий освоение морских месторождений)", "file": "01_lekcii.md", "text": "- **плавучие льды** затрудняют движение морского транспорта;"}, {"kind": "note", "title": "[photo_15] Вечная мерзлота в России (фактор, осложняющий освоение морских месторождений)", "file": "01_lekcii.md", "text": "- **белые медведи** — сильны, опасны и непредсказуемы."}, {"kind": "note", "title": "[photo_15] Вечная мерзлота в России (фактор, осложняющий освоение морских месторождений)", "file": "01_lekcii.md", "text": "- (На фото — МЛСП «Приразломная» во льдах.)"}, {"kind": "note", "title": "[photo_16] Экспедиция по уточнению границ шельфа России в Арктике", "file": "01_lekcii.md", "text": "- Согласно Конвенции ООН по морскому праву, страны могут претендовать на участки морского дна за пределами 200-мильной зоны, если докажут, что их континентальный шельф геологически связан с этими участками."}, {"kind": "note", "title": "[photo_16] Экспедиция по уточнению границ шельфа России в Арктике", "file": "01_lekcii.md", "text": "- Территория, на которую претендует Россия: площадь **≈1,2 млн км²**; оценка запасов: **5–10 млрд т углеводородов**, месторождения марганца, золота, олова, свинца, никеля и т.д."}, {"kind": "note", "title": "[photo_16] Экспедиция по уточнению границ шельфа России в Арктике", "file": "01_lekcii.md", "text": "- **В 2001 г.** Россия подала заявку в ООН на установление внешней границы шельфа в Северном Ледовитом океане."}, {"kind": "note", "title": "[photo_16] Экспедиция по уточнению границ шельфа России в Арктике", "file": "01_lekcii.md", "text": "- Экспедиции проводились в **2005, 2007 и 2010** гг. Цель — собрать научные доказательства для закрепления на юридическом уровне внешней границы континентального шельфа России."}, {"kind": "note", "title": "[photo_16] Экспедиция по уточнению границ шельфа России в Арктике", "file": "01_lekcii.md", "text": "- Цель экспедиций 2005 и 2007 гг. — **точное измерение глубин**."}, {"kind": "note", "title": "[photo_16] Экспедиция по уточнению границ шельфа России в Арктике", "file": "01_lekcii.md", "text": "- Цель экспедиции 2010 г. — **сейсморазведка**, призванная определить **мощность донных отложений**, толщина которых является одним из критериев для определения границ континентального шельфа."}, {"kind": "note", "title": "[photo_16] Экспедиция по уточнению границ шельфа России в Арктике", "file": "01_lekcii.md", "text": "- В 2005 и 2007 гг. **НЭС «Академик Федоров»** совершал экспедиции; на судно установлено новое оборудование, в т.ч. **многолучевой эхолот**, позволяющий одновременно во многих точках измерять глубины океана и определять рельеф дна."}, {"kind": "note", "title": "[photo_16] Экспедиция по уточнению границ шельфа России в Арктике", "file": "01_lekcii.md", "text": "- Продолжительность экспедиции — **около 80–90 суток**."}, {"kind": "note", "title": "[photo_16] Экспедиция по уточнению границ шельфа России в Арктике", "file": "01_lekcii.md", "text": "- **В 2015 г.** Россия во второй раз подала заявку в ООН."}, {"kind": "note", "title": "[photo_16] Экспедиция по уточнению границ шельфа России в Арктике", "file": "01_lekcii.md", "text": "- **3 апреля 2019 г.** подкомиссия ООН предварительно признала геологическую принадлежность части территорий Арктики российскому континентальному шельфу. Это вызвало негодование **Дании и Канады**, поддерживаемых **США**, которые возобновили спор о принадлежности **хребта Ломоносова**."}, {"kind": "note", "title": "[photo_16] Экспедиция по уточнению границ шельфа России в Арктике", "file": "01_lekcii.md", "text": "- В составе экспедиции специалисты: ВНИИ Океангеологии; Арктического и антарктического НИИ (ААНИИ); Научно-исследовательского навигационно-гидрографического института (ГНИНГИ); Министерства обороны; Министерства природных ресурсов."}, {"kind": "note", "title": "[photo_17] Россия и Норвегия поделили спорную территорию в Баренцевом море", "file": "01_lekcii.md", "text": "- **15 сентября 2010** Россия и Норвегия подписали Договор о разграничении морских пространств в Баренцевом море и Северном Ледовитом океане (по компромиссной красной линии)."}, {"kind": "note", "title": "[photo_17] Россия и Норвегия поделили спорную территорию в Баренцевом море", "file": "01_lekcii.md", "text": "- **30 марта 2011** Совет Федерации ратифицировал договор."}, {"kind": "note", "title": "[photo_17] Россия и Норвегия поделили спорную территорию в Баренцевом море", "file": "01_lekcii.md", "text": "- Спор шёл со времён СССР — **с 1970-х годов**."}, {"kind": "note", "title": "[photo_17] Россия и Норвегия поделили спорную территорию в Баренцевом море", "file": "01_lekcii.md", "text": "- СССР (и Россия) настаивали на **секторной линии вдоль 32° в.д.**; Норвегия требовала раздела по **срединной линии** — линии равных расстояний между берегами двух стран (часто встречающийся, но не универсальный принцип)."}, {"kind": "note", "title": "[photo_18] Кто претендует на Антарктиду", "file": "01_lekcii.md", "text": "- **Международный Договор об Антарктике (1959 г.)** «заморозил» территориальные претензии на все земли южнее **60° ю.ш.** Однако ряд стран по-прежнему предъявляет права."}, {"kind": "note", "title": "[photo_18] Кто претендует на Антарктиду", "file": "01_lekcii.md", "text": "- **Великобритания** — «Британская Антарктика» с Антарктическим полуостровом, 1,7 млн км²; пересекается с претензиями Аргентины и Чили."}, {"kind": "note", "title": "[photo_18] Кто претендует на Антарктиду", "file": "01_lekcii.md", "text": "- **Норвегия** — Земля Королевы Мод, Земля Котса, о. Петра I; ~2,5 млн км² (в 6,5 раза больше самой Норвегии). С 1939 по 1945 на эти земли претендовала фашистская Германия."}, {"kind": "note", "title": "[photo_18] Кто претендует на Антарктиду", "file": "01_lekcii.md", "text": "- **Австралия** — крупнейшее притязание, ~5,9 млн км² (между 44°38′ в.д. и 160° в.д., исключая Землю Адели)."}, {"kind": "note", "title": "[photo_18] Кто претендует на Антарктиду", "file": "01_lekcii.md", "text": "- **Аргентина** — «Аргентинская Антарктика» внутри «Британской», 966 тыс. км²."}, {"kind": "note", "title": "[photo_18] Кто претендует на Антарктиду", "file": "01_lekcii.md", "text": "- **Чили** — 1,25 млн км², к югу от страны за проливом Дрейка."}, {"kind": "note", "title": "[photo_18] Кто претендует на Антарктиду", "file": "01_lekcii.md", "text": "- **Новая Зеландия** — 450 тыс. км², обрамляющие море Росса. Между новозеландским и чилийским секторами — территория, на которую не претендует ни одно государство."}, {"kind": "note", "title": "[photo_18] Кто претендует на Антарктиду", "file": "01_lekcii.md", "text": "- **Франция** — Земля Адели (432 тыс. км²)."}, {"kind": "note", "title": "[photo_19] Каспий — море или озеро? Применимо ли понятие «шельф» к Каспийскому морю. Особый правовой статус", "file": "01_lekcii.md", "text": "| Характеристика | 1. Северный Каспий | 2. Средний Каспий | 3. Южный Каспий |"}, {"kind": "note", "title": "[photo_19] Каспий — море или озеро? Применимо ли понятие «шельф» к Каспийскому морю. Особый правовой статус", "file": "01_lekcii.md", "text": "|---|---|---|---|"}, {"kind": "note", "title": "[photo_19] Каспий — море или озеро? Применимо ли понятие «шельф» к Каспийскому морю. Особый правовой статус", "file": "01_lekcii.md", "text": "| Средняя глубина | **4–5 м** | **190 м** | **до 1025 м** |"}, {"kind": "note", "title": "[photo_19] Каспий — море или озеро? Применимо ли понятие «шельф» к Каспийскому морю. Особый правовой статус", "file": "01_lekcii.md", "text": "| Доля в площади моря | ~25% | ~36% | ~39% |"}, {"kind": "note", "title": "[photo_19] Каспий — море или озеро? Применимо ли понятие «шельф» к Каспийскому морю. Особый правовой статус", "file": "01_lekcii.md", "text": "| Доля в объёме воды | <1% | ~33% | ~66% |"}, {"kind": "note", "title": "[photo_19] Каспий — море или озеро? Применимо ли понятие «шельф» к Каспийскому морю. Особый правовой статус", "file": "01_lekcii.md", "text": "| Солёность | низкая (1–8‰) | 11,2–12,8‰, увеличивается к югу и востоку | выше, чем в средней части |"}, {"kind": "note", "title": "[photo_19] Каспий — море или озеро? Применимо ли понятие «шельф» к Каспийскому морю. Особый правовой статус", "file": "01_lekcii.md", "text": "| Ледовый покров | полностью замерзает | частично (в суровые зимы) | практически не замерзает |"}, {"kind": "note", "title": "[photo_19] Каспий — море или озеро? Применимо ли понятие «шельф» к Каспийскому морю. Особый правовой статус", "file": "01_lekcii.md", "text": "| Основной приток | речной сток (Волга, Урал) | — | — |"}, {"kind": "note", "title": "[photo_19] Каспий — море или озеро? Применимо ли понятие «шельф» к Каспийскому морю. Особый правовой статус", "file": "01_lekcii.md", "text": "- Береговая линия **7000 км**; в море впадает **свыше 130 рек**; площадь **371 000 км²**; наибольшая глубина **1025 м**; солёность до 13‰."}, {"kind": "note", "title": "[photo_19] Каспий — море или озеро? Применимо ли понятие «шельф» к Каспийскому морю. Особый правовой статус", "file": "01_lekcii.md", "text": "- Три части заметно различаются по глубине, гидрологическому режиму и геологическому строению."}, {"kind": "note", "title": "[photo_20] Конвенция о правовом статусе Каспийского моря", "file": "01_lekcii.md", "text": "- Подписана в г. **Актау (Казахстан) 12.08.2018** пятью государствами: **Азербайджан, Иран, Казахстан, Россия, Туркменистан**."}, {"kind": "note", "title": "[photo_20] Конвенция о правовом статусе Каспийского моря", "file": "01_lekcii.md", "text": "- По терминологии Каспий — **внутриконтинентальный водоём** (ни море, ни озеро)."}, {"kind": "note", "title": "[photo_20] Конвенция о правовом статусе Каспийского моря", "file": "01_lekcii.md", "text": "- **Разграничение зон**: прибрежные зоны — **15 морских миль территориальных вод**, **10 миль рыболовной зоны**, центральная акватория — в общем пользовании. Возможно из-за уникального статуса Каспия."}, {"kind": "note", "title": "[photo_20] Конвенция о правовом статусе Каспийского моря", "file": "01_lekcii.md", "text": "- Разграничение дна и недр на секторы — **по договорённости сопредельных и противолежащих государств** с учётом общепризнанных принципов и норм международного права."}, {"kind": "note", "title": "[photo_20] Конвенция о правовом статусе Каспийского моря", "file": "01_lekcii.md", "text": "- Прибрежное государство имеет исключительное право сооружать, разрешать и регулировать создание, эксплуатацию и использование искусственных островов, установок и сооружений в пределах своего сектора; может устанавливать вокруг них зоны безопасности. Ширина зон безопасности — **не более 500 м** от каждой точки внешнего края."}, {"kind": "note", "title": "[photo_20] Конвенция о правовом статусе Каспийского моря", "file": "01_lekcii.md", "text": "- 15 морских миль = 27,78 км."}, {"kind": "note", "title": "[photo_21] Каспий — ратификация конвенции", "file": "01_lekcii.md", "text": "- Разграничение **южной части моря**, где расположено большинство спорных месторождений, **вынесено за рамки конвенции**."}, {"kind": "note", "title": "[photo_21] Каспий — ратификация конвенции", "file": "01_lekcii.md", "text": "- Пункт 1 статьи 8 Конвенции: «Разграничение дна и недр Каспийского моря на секторы осуществляется по договорённости сопредельных и противолежащих государств с учётом общепризнанных принципов и норм международного права…»."}, {"kind": "note", "title": "[photo_21] Каспий — ратификация конвенции", "file": "01_lekcii.md", "text": "- **Но подписать не значит ратифицировать!** Чтобы документ заработал, необходима ратификация всеми странами-подписантами."}, {"kind": "note", "title": "[photo_21] Каспий — ратификация конвенции", "file": "01_lekcii.md", "text": "- Ст. 22: «Настоящая конвенция вступает в силу с даты получения депозитарием **пятой ратификационной грамоты**»."}, {"kind": "note", "title": "[photo_21] Каспий — ратификация конвенции", "file": "01_lekcii.md", "text": "- На сегодняшний день её **не ратифицировал лишь Иран**."}, {"kind": "note", "title": "[photo_22] Запасы и ресурсы (слайд 30)", "file": "01_lekcii.md", "text": "Приказ Минприроды РФ от 1 ноября 2013 г. **№ 477** «Об утверждении Классификации запасов и ресурсов нефти и горючих газов»."}, {"kind": "note", "title": "[photo_22] Запасы и ресурсы (слайд 30)", "file": "01_lekcii.md", "text": "- **Ресурсы** — для **не вскрытых бурением** объектов с предполагаемой нефтегазоносностью:"}, {"kind": "note", "title": "[photo_22] Запасы и ресурсы (слайд 30)", "file": "01_lekcii.md", "text": "- **геологические ресурсы** — количество нефти, газа и конденсата, содержащееся в не вскрытых бурением ловушках, нефтегазоносных или перспективных пластах, горизонтах или комплексах, наличие которых предполагается на основе геологических представлений, теоретических предпосылок, результатов геологических, геофизических и геохимических исследований;"}, {"kind": "note", "title": "[photo_22] Запасы и ресурсы (слайд 30)", "file": "01_lekcii.md", "text": "- **извлекаемые ресурсы** — часть геологических ресурсов, которую прогнозируется извлечь из недр с использованием доступных технологий с учётом требований по охране недр и окружающей среды."}, {"kind": "note", "title": "[photo_22] Запасы и ресурсы (слайд 30)", "file": "01_lekcii.md", "text": "- **Запасы** залежей и месторождений:"}, {"kind": "note", "title": "[photo_22] Запасы и ресурсы (слайд 30)", "file": "01_lekcii.md", "text": "- **геологические запасы** — количество нефти, газа, конденсата и содержащихся в них компонентов, которое находится в недрах в **изученных бурением** залежах, наличие которых доказано пробной или промышленной эксплуатацией или испытанием скважин или обосновывается геолого-геофизическими исследованиями;"}, {"kind": "note", "title": "[photo_22] Запасы и ресурсы (слайд 30)", "file": "01_lekcii.md", "text": "- **извлекаемые запасы** — часть геологических запасов, которая может быть добыта из залежи (месторождения) за весь срок разработки в рамках оптимальных проектных решений с использованием доступных технологий с учётом требований по охране недр и окружающей среды."}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "**Запасы** — по степени промышленного освоения и геологической изученности — категории:"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **A** — разбуренные, разрабатываемые;"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **B1** — разрабатываемые отдельными скважинами, неразбуренные эксплуатационной сеткой скважин, разведанные, подготовленные к промышленной разработке;"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **B2** — разрабатываемые, неразбуренные, оценённые;"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **C1** — разведанные;"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **C2** — оценённые."}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "**Ресурсы** — по степени геологической изученности и обоснованности — **четыре категории**:"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **D0** — подготовленные; **Dл** — локализованные; **D1** — перспективные; **D2** — прогнозируемые."}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "**Типы месторождений (залежей) по фазовому состоянию:**"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **нефтяные (Н)** — содержат только нефть, насыщенную в различной степени газом;"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **газонефтяные (ГН)** — основная часть залежи нефтяная, газовая шапка **не превышает** по объёму нефтяную часть;"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **нефтегазовые (НГ)** — газовые залежи с нефтяной оторочкой и залежи, в которых газовая шапка **превышает** по объёму нефтяную часть;"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **газовые (Г)** — только газ;"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **газоконденсатные (ГК)** — газ с конденсатом;"}, {"kind": "note", "title": "[photo_23] Категории ресурсов нефти и газа (слайд 31)", "file": "01_lekcii.md", "text": "- **нефтегазоконденсатные (НГК)** — нефть, газ и конденсат."}, {"kind": "note", "title": "[photo_24] Группы месторождений по величине начальных извлекаемых запасов (слайд 32)", "file": "01_lekcii.md", "text": "| Группа | Нефть, млн т | Газ, млрд м³ |"}, {"kind": "note", "title": "[photo_24] Группы месторождений по величине начальных извлекаемых запасов (слайд 32)", "file": "01_lekcii.md", "text": "|---|---|---|"}, {"kind": "note", "title": "[photo_24] Группы месторождений по величине начальных извлекаемых запасов (слайд 32)", "file": "01_lekcii.md", "text": "| 1. уникальные | > 300 | > 300 |"}, {"kind": "note", "title": "[photo_24] Группы месторождений по величине начальных извлекаемых запасов (слайд 32)", "file": "01_lekcii.md", "text": "| 2. крупные | 30–300 | 30–300 |"}, {"kind": "note", "title": "[photo_24] Группы месторождений по величине начальных извлекаемых запасов (слайд 32)", "file": "01_lekcii.md", "text": "| 3. средние | 5–30 | 5–30 |"}, {"kind": "note", "title": "[photo_24] Группы месторождений по величине начальных извлекаемых запасов (слайд 32)", "file": "01_lekcii.md", "text": "| 4. мелкие | 1–5 | 1–5 |"}, {"kind": "note", "title": "[photo_24] Группы месторождений по величине начальных извлекаемых запасов (слайд 32)", "file": "01_lekcii.md", "text": "| 5. очень мелкие | < 1 | < 1 |"}, {"kind": "note", "title": "[photo_25] Контрольные вопросы по пройденному материалу (слайд 33)", "file": "01_lekcii.md", "text": "1. Сколько суммарно (в %) составляют нефть и газ в структуре мирового энергопотребления? *(на слайдах цифры нет; общеизвестно ≈ 55–57%: нефть ~31–33%, газ ~23–24%)*"}, {"kind": "note", "title": "[photo_25] Контрольные вопросы по пройденному материалу (слайд 33)", "file": "01_lekcii.md", "text": "2. Чем извлекаемые запасы отличаются от геологических? → извлекаемые — часть геологических, которая может быть добыта за весь срок разработки доступными технологиями."}, {"kind": "note", "title": "[photo_25] Контрольные вопросы по пройденному материалу (слайд 33)", "file": "01_lekcii.md", "text": "3. Чем геологические ресурсы отличаются от извлекаемых? → извлекаемые — часть геологических, которую прогнозируется извлечь."}, {"kind": "note", "title": "[photo_25] Контрольные вопросы по пройденному материалу (слайд 33)", "file": "01_lekcii.md", "text": "4. Чем отличаются запасы от ресурсов? → запасы — в изученных (вскрытых) бурением залежах; ресурсы — в не вскрытых бурением объектах."}, {"kind": "note", "title": "[photo_25] Контрольные вопросы по пройденному материалу (слайд 33)", "file": "01_lekcii.md", "text": "5. Как делятся запасы нефти и газа по категориям? → A, B1, B2, C1, C2 (ресурсы — D0, Dл, D1, D2)."}, {"kind": "note", "title": "[photo_25] Контрольные вопросы по пройденному материалу (слайд 33)", "file": "01_lekcii.md", "text": "6. Типы месторождений по фазовому состоянию? → Н, ГН, НГ, Г, ГК, НГК."}, {"kind": "note", "title": "[photo_25] Контрольные вопросы по пройденному материалу (слайд 33)", "file": "01_lekcii.md", "text": "7. Доля Арктики (в %) в углеводородных запасах континентального шельфа → **87%** (начальные суммарные ресурсы морских регионов России)."}, {"kind": "note", "title": "[photo_25] Контрольные вопросы по пройденному материалу (слайд 33)", "file": "01_lekcii.md", "text": "8. Приарктические государства → Россия, США, Канада, Дания (Гренландия), Норвегия (+ Исландия, Швеция, Финляндия — члены Арктического совета)."}, {"kind": "note", "title": "[photo_25] Контрольные вопросы по пройденному материалу (слайд 33)", "file": "01_lekcii.md", "text": "9. Доля РФ в извлекаемых УВ ресурсах арктических морей → газ **70%**, нефть **41%**."}, {"kind": "note", "title": "[photo_25] Контрольные вопросы по пройденному материалу (слайд 33)", "file": "01_lekcii.md", "text": "10. Моря РФ и распределение ресурсов: Арктические **87%**, Дальневосточные **10%**, остальные (Каспийское, Азовское, Черное, Балтийское) **3%**."}, {"kind": "note", "title": "[photo_26] Освоение морских месторождений углеводородов", "file": "01_lekcii.md", "text": "- **Комплекс работ по поисково-разведочному и эксплуатационному бурению, проектированию, обустройству и эксплуатации морского месторождения углеводородов.** (ГОСТ Р 55311-2012 «Нефтяная и газовая промышленность. Сооружения нефтегазопромысловые морские. Термины и определения»)"}, {"kind": "note", "title": "[photo_27] Основные этапы работ", "file": "01_lekcii.md", "text": "1. Геолого-геофизические исследования"}, {"kind": "note", "title": "[photo_27] Основные этапы работ", "file": "01_lekcii.md", "text": "2. Разведочное и эксплуатационное бурение"}, {"kind": "note", "title": "[photo_27] Основные этапы работ", "file": "01_lekcii.md", "text": "3. Обустройство нефтегазовых месторождений"}, {"kind": "note", "title": "[photo_27] Основные этапы работ", "file": "01_lekcii.md", "text": "4. Эксплуатация морских нефтегазовых месторождений"}, {"kind": "note", "title": "[photo_27] Основные этапы работ", "file": "01_lekcii.md", "text": "5. Ликвидация морских нефтегазовых промыслов"}, {"kind": "note", "title": "[photo_28] Термины (слайд 36, ГОСТ Р 55311-2012)", "file": "01_lekcii.md", "text": "- **Поиск** — комплекс работ, направленных на выявление и изучение перспективных структур на континентальном шельфе морей и океанов, представляющих природные скопления полезных ископаемых, в т.ч. УВ."}, {"kind": "note", "title": "[photo_28] Термины (слайд 36, ГОСТ Р 55311-2012)", "file": "01_lekcii.md", "text": "- **Разведка** — комплекс работ с целью определения параметров месторождения, необходимых для оценки целесообразности его промышленной разработки, а также для проектирования и строительства добывающих комплексов."}, {"kind": "note", "title": "[photo_28] Термины (слайд 36, ГОСТ Р 55311-2012)", "file": "01_lekcii.md", "text": "- **Проектирование разработки морского месторождения** — процесс исследования, формирования, обоснования и выбора оптимального варианта системы разработки, обеспечивающий рентабельность инвестиций в освоение месторождения при соблюдении условий рационального недропользования и экологической безопасности акватории."}, {"kind": "note", "title": "[photo_28] Термины (слайд 36, ГОСТ Р 55311-2012)", "file": "01_lekcii.md", "text": "- **Разработка морских месторождений** — система технических решений и мероприятий, обеспечивающих наиболее рациональное извлечение жидких и газообразных УВ из месторождений континентального шельфа."}, {"kind": "note", "title": "[photo_28] Термины (слайд 36, ГОСТ Р 55311-2012)", "file": "01_lekcii.md", "text": "- **Проектирование обустройства морского месторождения** — разработка проектной документации наземных, подводных и надводных сооружений систем добычи, подготовки пластовой продукции и её транспортировки. Составляется на основе проекта разработки месторождения и результатов инженерно-геологических, гидрогеологических, гидрометеорологических изысканий."}, {"kind": "note", "title": "[photo_28] Термины (слайд 36, ГОСТ Р 55311-2012)", "file": "01_lekcii.md", "text": "- **Обустройство морского месторождения** — комплекс строительно-монтажных работ по сооружению подводных, надводных и наземных сооружений систем добычи, подготовки пластовой продукции, хранения и транспортировки УВ, извлекаемых из морского месторождения."}, {"kind": "note", "title": "[photo_28] Термины (слайд 36, ГОСТ Р 55311-2012)", "file": "01_lekcii.md", "text": "- **Эксплуатация** — добыча, первичная подготовка, хранение и транспортировка."}, {"kind": "note", "title": "[photo_28] Термины (слайд 36, ГОСТ Р 55311-2012)", "file": "01_lekcii.md", "text": "- **Добыча** УВ — извлечение их из скважины на поверхность комплексом механизмов и оборудования."}, {"kind": "note", "title": "[photo_28] Термины (слайд 36, ГОСТ Р 55311-2012)", "file": "01_lekcii.md", "text": "- **Первичная подготовка** — очистка, осушка, сепарирование (газ), дегазация, обезвоживание, обессоливание (нефть)."}, {"kind": "note", "title": "[photo_28] Термины (слайд 36, ГОСТ Р 55311-2012)", "file": "01_lekcii.md", "text": "- **Хранение** — как правило, **кратковременное**, в плавучих и стационарных резервуарах-хранилищах."}, {"kind": "note", "title": "[photo_28] Термины (слайд 36, ГОСТ Р 55311-2012)", "file": "01_lekcii.md", "text": "- **Для транспортировки** применяют подводные трубопроводы и суда."}, {"kind": "note", "title": "[photo_29] Сейсморазведочные работы в море", "file": "01_lekcii.md", "text": "- Объёмы морских сейсморазведочных работ в мире **более чем в 4 раза** превышают объёмы работ на суше."}, {"kind": "note", "title": "[photo_29] Сейсморазведочные работы в море", "file": "01_lekcii.md", "text": "- **Сейсморазведка** — анализ распространения в земной коре сейсмических (упругих) волн, их преломления и отражения от различных горизонтов (слоёв) горных пород. **Пневмоисточники** вызывают упругие волны, которые, проходя через слой морской воды, распространяются в толще земной коры, изменяют направление и свойства при прохождении через разные типы горных пород."}, {"kind": "note", "title": "[photo_29] Сейсморазведочные работы в море", "file": "01_lekcii.md", "text": "- Сейсморазведочное судно **Ramform Titan**: длина **104,2 м**, ширина **70 м**. На судне **24 барабана**, каждый — сейсмическая коса длиной **12 км**. Сеть из сотен тысяч сейсмических датчиков одновременно покрывает площадь более **12 км²**."}, {"kind": "note", "title": "[photo_29] Сейсморазведочные работы в море", "file": "01_lekcii.md", "text": "- Сейсмическая коса на барабане."}, {"kind": "note", "title": "[photo_30] Сейсморазведочные работы в море (2)", "file": "01_lekcii.md", "text": "- Косы буксируют на глубине порядка **10 м** при скорости судна до **6–7 узлов (11–12 км/ч)**."}, {"kind": "note", "title": "[photo_30] Сейсморазведочные работы в море (2)", "file": "01_lekcii.md", "text": "- Источник сигнала — **пневматические излучатели** (пневмопушки)."}, {"kind": "note", "title": "[photo_31] Требования и рекомендации по обустройству при проектировании морских объектов", "file": "01_lekcii.md", "text": "- подбор технологического оборудования и трубопроводов, обеспечивающих эксплуатацию месторождения в течение всего времени его разработки;"}, {"kind": "note", "title": "[photo_31] Требования и рекомендации по обустройству при проектировании морских объектов", "file": "01_lekcii.md", "text": "- **уменьшение числа технологических операций**, выполняемых на морских инженерных сооружениях; перечень операций, выполняемых на море и берегу, определяется для каждого конкретного проекта;"}, {"kind": "note", "title": "[photo_31] Требования и рекомендации по обустройству при проектировании морских объектов", "file": "01_lekcii.md", "text": "- рациональная компоновка технологического оборудования на платформе."}, {"kind": "note", "title": "[photo_32] Обеспечение процессов бурения, добычи и транспорта УВ ресурсов шельфа", "file": "01_lekcii.md", "text": "1. **Исследование атмосферы** — ветер, температура, влажность."}, {"kind": "note", "title": "[photo_32] Обеспечение процессов бурения, добычи и транспорта УВ ресурсов шельфа", "file": "01_lekcii.md", "text": "2. **Исследование гидросферы** — течение, волнение, лёд, айсберг, коррозия."}, {"kind": "note", "title": "[photo_32] Обеспечение процессов бурения, добычи и транспорта УВ ресурсов шельфа", "file": "01_lekcii.md", "text": "3. **Исследование литосферы** — геология, бурение, разработка, инженерная геология, сейсмика."}, {"kind": "note", "title": "[photo_32] Обеспечение процессов бурения, добычи и транспорта УВ ресурсов шельфа", "file": "01_lekcii.md", "text": "- Между гидросферой и атмосферой — ледовые образования, торосы, айсберги, обломки айсбергов."}, {"kind": "note", "title": "[photo_32] Обеспечение процессов бурения, добычи и транспорта УВ ресурсов шельфа", "file": "01_lekcii.md", "text": "- Для условий шельфа вопросы литосферы не являются специальными — они изучаются и для условий суши (поиск, разведка, бурение, разработка), а **верхний (поверхностный) слой как грунтовое основание сооружений** исследуется специально."}, {"kind": "note", "title": "[photo_33] Общая схема современных сооружений (сравнение высот)", "file": "01_lekcii.md", "text": "- Бурдж-Халифа — **828 м**; Останкинская телебашня — **540 м**; Эйфелева башня — **300 м**."}, {"kind": "note", "title": "[photo_33] Общая схема современных сооружений (сравнение высот)", "file": "01_lekcii.md", "text": "- Нефтяная платформа **Hibernia (Хайберния)**, Ньюфаундлендская банка — **224 м** (общая высота; гравитационная платформа)."}, {"kind": "note", "title": "[photo_33] Общая схема современных сооружений (сравнение высот)", "file": "01_lekcii.md", "text": "- Нефтегазовая платформа **Troll-A (Тролль)**, Северное море — **472 м** (самое высокое когда-либо перемещённое сооружение; гравитационная)."}, {"kind": "note", "title": "[photo_33] Общая схема современных сооружений (сравнение высот)", "file": "01_lekcii.md", "text": "- Нефтяная платформа **Petronius (Петрониус)**, Мексиканский залив — **610 м** (башня на оттяжках / податливая башня)."}, {"kind": "note", "title": "[photo_34] Основные факторы, влияющие на выбор типов сооружений и технических средств для обустройства морских месторождений нефти и газа (слайд 43)", "file": "01_lekcii.md", "text": "Преобладающие факторы:"}, {"kind": "note", "title": "[photo_34] Основные факторы, влияющие на выбор типов сооружений и технических средств для обустройства морских месторождений нефти и газа (слайд 43)", "file": "01_lekcii.md", "text": "- расположение месторождения, удалённость его от берега;"}, {"kind": "note", "title": "[photo_34] Основные факторы, влияющие на выбор типов сооружений и технических средств для обустройства морских месторождений нефти и газа (слайд 43)", "file": "01_lekcii.md", "text": "- природно-климатические условия;"}, {"kind": "note", "title": "[photo_34] Основные факторы, влияющие на выбор типов сооружений и технических средств для обустройства морских месторождений нефти и газа (слайд 43)", "file": "01_lekcii.md", "text": "- физико-химические характеристики добываемых флюидов;"}, {"kind": "note", "title": "[photo_34] Основные факторы, влияющие на выбор типов сооружений и технических средств для обустройства морских месторождений нефти и газа (слайд 43)", "file": "01_lekcii.md", "text": "- глубина акватории в месте добычи;"}, {"kind": "note", "title": "[photo_34] Основные факторы, влияющие на выбор типов сооружений и технических средств для обустройства морских месторождений нефти и газа (слайд 43)", "file": "01_lekcii.md", "text": "- дебиты скважин;"}, {"kind": "note", "title": "[photo_34] Основные факторы, влияющие на выбор типов сооружений и технических средств для обустройства морских месторождений нефти и газа (слайд 43)", "file": "01_lekcii.md", "text": "- давления в системе сбора;"}, {"kind": "note", "title": "[photo_34] Основные факторы, влияющие на выбор типов сооружений и технических средств для обустройства морских месторождений нефти и газа (слайд 43)", "file": "01_lekcii.md", "text": "- наличие инфраструктуры береговой зоны и др."}, {"kind": "note", "title": "[photo_35] Факторы, влияющие на выбор типа морского промысла, в т.ч. МНГС (морского нефтегазового сооружения)", "file": "01_lekcii.md", "text": "- **Технологические**: назначение скважин (разведочная, эксплуатационная); количество скважин; глубина скважин; технологическая схема подготовки продукции; вид добываемой продукции; вид транспорта добываемой продукции."}, {"kind": "note", "title": "[photo_35] Факторы, влияющие на выбор типа морского промысла, в т.ч. МНГС (морского нефтегазового сооружения)", "file": "01_lekcii.md", "text": "- **Гидрометеорологические**: глубина воды; наличие ледовых условий; продолжительность межледового периода; географическое расположение района строительства; течения."}, {"kind": "note", "title": "[photo_35] Факторы, влияющие на выбор типа морского промысла, в т.ч. МНГС (морского нефтегазового сооружения)", "file": "01_lekcii.md", "text": "- **Инженерно-геологические**: геологическое строение места строительства; сведения о современных тектонических процессах (разломы, надвиги и т.д.); физико-механические свойства грунтов; характеристики верхнего слоя грунтов (размывы)."}, {"kind": "note", "title": "[photo_35] Факторы, влияющие на выбор типа морского промысла, в т.ч. МНГС (морского нефтегазового сооружения)", "file": "01_lekcii.md", "text": "- **Производственные**: местонахождение заводов для изготовления конструкций; береговые инфраструктуры; характеристики плавучих подъёмно-транспортных средств; наличие машин и оборудования для создания свайного или гравитационного фундаментов; наличие технических средств для строительства грунтовых островных сооружений."}, {"kind": "note", "title": "[photo_35] Факторы, влияющие на выбор типа морского промысла, в т.ч. МНГС (морского нефтегазового сооружения)", "file": "01_lekcii.md", "text": "- **Экологические**: разработка **ОВОС** (оценка воздействия на окружающую среду); минимизация сбросов технологических и хозяйственно-бытовых отходов; создание системы мониторинга."}, {"kind": "note", "title": "[photo_36] Контрольные вопросы (слайд 45)", "file": "01_lekcii.md", "text": "1. Основные этапы освоения МНГМ (морских нефтегазовых месторождений). 2. Что включает поиск? 3. Разведка? 4. Разработка? 5. Обустройство? 6. Эксплуатация? 7. Основные факторы, влияющие на выбор типа сооружений и технических средств."}, {"kind": "note", "title": "[photo_37] Проблемы освоения МНГМ (слайд 46) (два одинаковых фото)", "file": "01_lekcii.md", "text": "- Создание современных технологий и технических средств, необходимых для обустройства и эксплуатации северных морей."}, {"kind": "note", "title": "[photo_37] Проблемы освоения МНГМ (слайд 46) (два одинаковых фото)", "file": "01_lekcii.md", "text": "- Создание единой научно-производственной базы по разработке проектов и изготовлению и строительству морских инженерных сооружений."}, {"kind": "note", "title": "[photo_37] Проблемы освоения МНГМ (слайд 46) (два одинаковых фото)", "file": "01_lekcii.md", "text": "- Необходимость международного объединения научного потенциала."}, {"kind": "note", "title": "[photo_37] Проблемы освоения МНГМ (слайд 46) (два одинаковых фото)", "file": "01_lekcii.md", "text": "- Создание индустрии сжиженного газа, максимально приближенной к местам добычи."}, {"kind": "note", "title": "[photo_37] Проблемы освоения МНГМ (слайд 46) (два одинаковых фото)", "file": "01_lekcii.md", "text": "- Создание подводных нефтегазовых промыслов на труднодоступных акваториях."}, {"kind": "note", "title": "[photo_37] Проблемы освоения МНГМ (слайд 46) (два одинаковых фото)", "file": "01_lekcii.md", "text": "- Создание нормативной базы обеспечения работ на шельфе."}, {"kind": "note", "title": "[photo_38] Рекорды в нефтегазовой индустрии", "file": "01_lekcii.md", "text": "- В **ноябре 2017** г. на месторождении **Чайво** с **МЛСП «Орлан»** пробурена скважина с горизонтальным окончанием. Длина по стволу — **15 тыс. м**, отход от вертикали — **14 129 м** (проект **«Сахалин-1»**)."}, {"kind": "note", "title": "[photo_38] Рекорды в нефтегазовой индустрии", "file": "01_lekcii.md", "text": "- Для сравнения: **Кольская сверхглубокая скважина — 12 262 м** — внесена в Книгу рекордов Гиннесса как «самое глубокое вторжение человека в земную кору»."}, {"kind": "note", "title": "[photo_38] Рекорды в нефтегазовой индустрии", "file": "01_lekcii.md", "text": "- Самая глубоководная платформа, установленная на дне моря, — **Petronius**. Высота **609,9 м**, из них надводная часть только **75 м**. Общий вес конструкции — **43 тыс. т**. Находится в **Мексиканском заливе**, в **210 км** от берега."}, {"kind": "note", "title": "[photo_38] Рекорды в нефтегазовой индустрии", "file": "01_lekcii.md", "text": "- Самое глубоководное эксплуатируемое месторождение — в **Мексиканском заливе**, глубина моря **2900 м**. Установлена **FPSO «Turritella»**, закреплённая к океанскому дну."}, {"kind": "note", "title": "[photo_38] Рекорды в нефтегазовой индустрии", "file": "01_lekcii.md", "text": "- Самое большое нефтяное месторождение — **«Гавар»** (Саудовская Аравия). Размеры **280×30 км**. Добыто более **65 млрд барр.**; **Aramco** оценивает остаточные ресурсы в **100 млрд барр.**"}, {"kind": "note", "title": "[photo_38] Рекорды в нефтегазовой индустрии", "file": "01_lekcii.md", "text": "- Самое большое газовое месторождение — **Северное / Южный Парс**, в **Персидском заливе**, в водах **Ирана (Южный Парс)** и **Катара (Северное)**. Запасы — **28 трлн м³ газа и 7 млрд т нефти**."}, {"kind": "note", "title": "[photo_39] Основные виды морских нефтегазовых промыслов", "file": "01_lekcii.md", "text": "С учётом природно-климатических, гидрометеорологических, горно-геологических условий и технико-экономических показателей выбирают способ обустройства морских месторождений и соответствующие ему нефтегазопромысловые сооружения:"}, {"kind": "note", "title": "[photo_39] Основные виды морских нефтегазовых промыслов", "file": "01_lekcii.md", "text": "1. **Надземные** промыслы"}, {"kind": "note", "title": "[photo_39] Основные виды морских нефтегазовых промыслов", "file": "01_lekcii.md", "text": "2. **Надводные** промыслы"}, {"kind": "note", "title": "[photo_39] Основные виды морских нефтегазовых промыслов", "file": "01_lekcii.md", "text": "3. **Подводные** промыслы"}, {"kind": "note", "title": "[photo_39] Основные виды морских нефтегазовых промыслов", "file": "01_lekcii.md", "text": "4. **Подземные (шахтно-тоннельные)** промыслы"}, {"kind": "note", "title": "[photo_39] Основные виды морских нефтегазовых промыслов", "file": "01_lekcii.md", "text": "5. **Комбинированные** промыслы"}, {"kind": "note", "title": "[photo_40] Наземные промыслы (схемы)", "file": "01_lekcii.md", "text": "1. **Бурение наклонно-направленных скважин с берега** (ствол скважины уходит под дно к нефтеносному горизонту). Врезка «World's longest oil wells»."}, {"kind": "note", "title": "[photo_40] Наземные промыслы (схемы)", "file": "01_lekcii.md", "text": "2. **Засыпка дна моря** (засыпка или намыв + ограждение)."}, {"kind": "note", "title": "[photo_40] Наземные промыслы (схемы)", "file": "01_lekcii.md", "text": "3. **Осушение дна моря на нефтегазоносном участке** (осушенная территория, насосная, ограждающая дамба)."}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "Преимущества:"}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "1. Отпадает необходимость сооружения в море стальных, ж/б платформ, что значительно снижает стоимость."}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "2. Исключаются характерные трудности при строительстве объектов в море и при бурении и эксплуатации скважин."}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "3. Не требуется строительство линий электропередач, связи и подводных трубопроводов."}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "4. Значительно облегчаются условия труда буровой бригады и обслуживающего персонала, повышается степень их безопасности."}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "5. Исключается угроза возможного загрязнения морской среды при бурении и эксплуатации скважин."}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "Недостатки:"}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "1. Более удалённые от берега участки залежи невозможно освоить этим методом."}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "2. Засыпку дна грунтом можно организовать **в спокойных бухтах**."}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "3. Для образования суши требуется наличие больших запасов грунта и камня, которые не всегда могут оказаться поблизости."}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "4. Сложность и капиталоёмкость работ по сооружению ограждающей дамбы."}, {"kind": "note", "title": "[photo_41] Наземные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "5. Опасность затопления территории промысла в случае разрушения оградительной дамбы под воздействием природных факторов."}, {"kind": "note", "title": "[photo_42] Надводные промыслы", "file": "01_lekcii.md", "text": "Все промысловые операции (бурение, добыча, подготовка, хранение, отгрузка и т.д.) выполняются **на надводных площадках**, созданных с помощью:"}, {"kind": "note", "title": "[photo_42] Надводные промыслы", "file": "01_lekcii.md", "text": "- эстакад с приэстакадными площадками;"}, {"kind": "note", "title": "[photo_42] Надводные промыслы", "file": "01_lekcii.md", "text": "- грунтовых островов;"}, {"kind": "note", "title": "[photo_42] Надводные промыслы", "file": "01_lekcii.md", "text": "- погружных платформ;"}, {"kind": "note", "title": "[photo_42] Надводные промыслы", "file": "01_lekcii.md", "text": "- стационарных платформ;"}, {"kind": "note", "title": "[photo_42] Надводные промыслы", "file": "01_lekcii.md", "text": "- плавучих полупогружных платформ;"}, {"kind": "note", "title": "[photo_42] Надводные промыслы", "file": "01_lekcii.md", "text": "- платформ типа **SPAR (СПАР), TLP, БУЙ** и др.;"}, {"kind": "note", "title": "[photo_42] Надводные промыслы", "file": "01_lekcii.md", "text": "- буровых и технологических судов."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "Преимущества:"}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "1. Все работы на морском промысле могут выполняться почти независимо от состояния погоды (эстакады)."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "2. Нет необходимости прокладки подводных трубопроводов (эстакады)."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "3. Имеется возможность расширения палубы (СП — стационарные платформы — в незамерзающих акваториях)."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "4. Крупноблочное строительство (СП не л/с — не ледостойкие)."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "5. Интегральное строительство (ЛСП, TLP, СПАР и др.)."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "6. Обеспечивается высокая надёжность по конструкционным особенностям."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "Недостатки:"}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "1. Технико-экономическая нецелесообразность использования в сложных ледовых условиях (эстакады)."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "2. Интенсивная коррозия (эстакады, стальные платформы)."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "3. Низкая сопротивляемость действию динамических нагрузок (эстакады)."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "4. С увеличением глубин повышается динамичность, что ограничивает применение платформ на больших глубинах."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "5. Значительные трудности использования ПБУ, ППБУ, БС и др. в сложных ледовых условиях."}, {"kind": "note", "title": "[photo_43] Надводные промыслы — преимущества и недостатки", "file": "01_lekcii.md", "text": "(Сокращения: СП — стационарная платформа; ЛСП — ледостойкая стационарная платформа; ПБУ — плавучая буровая установка; ППБУ — полупогружная плавучая буровая установка; БС — буровое судно; TLP — платформа на натяжных опорах (Tension Leg Platform); SPAR — платформа-колонна (буй-цилиндр).)"}, {"kind": "note", "title": "[photo_44] Морские платформы", "file": "01_lekcii.md", "text": "- **Плавучие** и **стационарные**."}, {"kind": "note", "title": "[photo_45] Стационарные платформы", "file": "01_lekcii.md", "text": "- **Неледостойкие**: **каркасно-свайные (20–100 м)**, многоблочные."}, {"kind": "note", "title": "[photo_45] Стационарные платформы", "file": "01_lekcii.md", "text": "- **Ледостойкие**: **гравитационные (20–300 м)**."}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| № | Платформа | Море | Оператор | Месторождение | Глубина моря, м | Год установки |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "|---|---|---|---|---|---|---|"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| 1 | Пильтун-Астохская-А (ПА-А, «Моликпак») | Охотское | Сахалинская энергия (Газпром) | Пильтун-Астохское | 30 | 1999 |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| 2 | Пильтун-Астохская-Б (ПА-Б) | Охотское | Сахалинская энергия (Газпром) | Пильтун-Астохское | 32 | 2008 |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| 3 | Лунская-А (ЛУН-А) | Охотское | Сахалинская энергия (Газпром) | Лунское | 48 | 2006 |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| 4 | **Орлан** | Охотское | Сахалин-1 (Роснефть) | **Чайво** | 15 | 2004 |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| 5 | **Беркут** | Охотское | Сахалин-1 (Роснефть) | **Аркутун-Даги** | 35 | 2014 |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| 6 | **МЛСП «Приразломная»** | **Печорское** | **Газпром нефть** | **Приразломное** | **20** | **2013** |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| 7 | Комплекс МЛСП **Д-6** | **Балтийское** | Лукойл Калининградморнефть | **Кравцовское** | 25–35 | 2004 |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| 8 | Комплекс ЛСП | Каспийское | Лукойл Нижневолжскнефть | им. **Корчагина** | 11–13 | 2010 |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| 9 | Комплекс ЛСП-1 | Каспийское | Лукойл Нижневолжскнефть | им. **Филановского** | 7–10 | 2016 |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| 10 | Комплекс ЛСП-2 | Каспийское | Лукойл Нижневолжскнефть | им. Филановского | 7–10 | 2017 |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "| 11 | Комплекс ЛСП | Каспийское | Лукойл Нижневолжскнефть | им. **Грайфера** | 5–8 | 2022 |"}, {"kind": "note", "title": "[photo_46] Таблица 1. Морские стационарные платформы РФ (2023 г.)", "file": "01_lekcii.md", "text": "Примечания: 1) по ООО «Сахалинская энергия» и ООО «Сахалин-1» в скобках указаны российские акционеры; 2) ледостойкие стационарные платформы (ЛСП) ПАО «Лукойл» на Балтике и Каспии, включающие добывающие платформы и платформы жилого модуля (в ряде случаев и технологические), показаны одной строкой как единый технологический комплекс морских ЛСП."}, {"kind": "note", "title": "Справочник по месторождениям и платформам шельфа РФ", "file": "02_mestorozhdeniya_spravka.md", "text": "Пометки: **[Л]** — есть в лекциях (photo_N), **[Т]** — подтверждено ответами учебного портала, **[С]** — справочно, из открытых источников; порталом не проверено, используй, если в лекциях и тестах ответа нет."}, {"kind": "note", "title": "Справочник по месторождениям и платформам шельфа РФ", "file": "02_mestorozhdeniya_spravka.md", "text": "> ⚠ Тесты на портале штрафуют за неверный выбор (−1 балл за неверный ответ, «слишком много вариантов» в вопросах с несколькими ответами). Не отмечай лишнего."}, {"kind": "note", "title": "Распределение по морям (шпаргалка)", "file": "02_mestorozhdeniya_spravka.md", "text": "| Море | Месторождения |"}, {"kind": "note", "title": "Распределение по морям (шпаргалка)", "file": "02_mestorozhdeniya_spravka.md", "text": "|---|---|"}, {"kind": "note", "title": "Распределение по морям (шпаргалка)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Баренцево** | **Штокмановское** ГКМ [Т], **Ледовое** ГКМ [Т], Лудловское, Мурманское, Северо-Кильдинское [С] |"}, {"kind": "note", "title": "Распределение по морям (шпаргалка)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Печорское** (юго-восточная часть Баренцева, но в тестах считается отдельно!) | **Приразломное** [Т], **Долгинское** [Т], Медынское-море, Варандей-море [С] |"}, {"kind": "note", "title": "Распределение по морям (шпаргалка)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Карское** | **Ленинградское** ГКМ [Т], **Русановское** (газовое) [Т], **Победа** (Роснефть) [Т/С] |"}, {"kind": "note", "title": "Распределение по морям (шпаргалка)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Обско-Тазовская губа** | **Северо-Каменномысское**, **Каменномысское-море**, **Чугорьяхинское**, **Обское** [Л][Т]; **Семаковское**, **Тота-Яхинское**, Антипаютинское [С, выведено из подсчёта баллов] |"}, {"kind": "note", "title": "Распределение по морям (шпаргалка)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Охотское** (Сахалин) | Сахалин-1: **Чайво, Одопту-море, Аркутун-Даги**; Сахалин-2: **Пильтун-Астохское** (нефтяное), **Лунское** (газовое); Сахалин-3: **Киринское**, Южно-Киринское, Венинский, Аяшский, Восточно-Одоптинский блоки [Л][Т] |"}, {"kind": "note", "title": "Распределение по морям (шпаргалка)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Каспийское** (Лукойл) | им. **Корчагина** (2010), им. **Филановского** (2016), им. **Грайфера** (= Ракушечное, 2022), им. **Кувыкина** (= Сарматское), Хвалынское, Центральное, «170 км» [Л][Т] |"}, {"kind": "note", "title": "Распределение по морям (шпаргалка)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Балтийское** | **Кравцовское** (МЛСП Д-6, Лукойл, 2004) [Л][Т] |"}, {"kind": "note", "title": "Распределение по морям (шпаргалка)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Азовское** | Темрюкско-Ахтарский участок (10 м) [Л] |"}, {"kind": "note", "title": "Распределение по морям (шпаргалка)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Черное** | Туапсинский прогиб (1000–2000 м), Западно-Черноморская площадь (1700–2100 м) [Л] |"}, {"kind": "note", "title": "МЛСП «Приразломная» / месторождение Приразломное", "file": "02_mestorozhdeniya_spravka.md", "text": "- Море — **Печорское** [Т]; **не** Баренцево в тестах [Т]."}, {"kind": "note", "title": "МЛСП «Приразломная» / месторождение Приразломное", "file": "02_mestorozhdeniya_spravka.md", "text": "- Глубина моря — **19–20 м** (в таблице 20 м) [Т][Л]."}, {"kind": "note", "title": "МЛСП «Приразломная» / месторождение Приразломное", "file": "02_mestorozhdeniya_spravka.md", "text": "- Тип платформы — **гравитационная** (ледостойкая стационарная) [Т][Л]."}, {"kind": "note", "title": "МЛСП «Приразломная» / месторождение Приразломное", "file": "02_mestorozhdeniya_spravka.md", "text": "- Заказчик — **ООО «Газпром нефть шельф»** [Т]; оператор — Газпром нефть [Л]."}, {"kind": "note", "title": "МЛСП «Приразломная» / месторождение Приразломное", "file": "02_mestorozhdeniya_spravka.md", "text": "- Год установки — **2013** (табл. photo_46) [Л]; первая нефть — декабрь 2013 [С]; на карте photo_10 указан 2016 (план)."}, {"kind": "note", "title": "МЛСП «Приразломная» / месторождение Приразломное", "file": "02_mestorozhdeniya_spravka.md", "text": "- Расстояние до **Мурманска — 1200 км** [Т]; до берега (пос. Варандей) — **60 км** [С]."}, {"kind": "note", "title": "МЛСП «Приразломная» / месторождение Приразломное", "file": "02_mestorozhdeniya_spravka.md", "text": "- Хранение нефти — **мокрый** способ (в кессоне платформы) [Т]."}, {"kind": "note", "title": "МЛСП «Приразломная» / месторождение Приразломное", "file": "02_mestorozhdeniya_spravka.md", "text": "- Челночные танкеры **«Михаил Ульянов»** и **«Кирилл Лавров»** с носовой загрузкой; бесконтактная швартовка на расстоянии **80 м** [Т]."}, {"kind": "note", "title": "МЛСП «Приразломная» / месторождение Приразломное", "file": "02_mestorozhdeniya_spravka.md", "text": "- Сорт нефти — ARCO (Arctic Oil) [С]. Построена на «Севмаше» (Северодвинск) [С]."}, {"kind": "note", "title": "МЛСП «Приразломная» / месторождение Приразломное", "file": "02_mestorozhdeniya_spravka.md", "text": "- На фото в лекции (photo_15) — платформа во льдах как иллюстрация проблем Арктики."}, {"kind": "note", "title": "Штокмановское ГКМ", "file": "02_mestorozhdeniya_spravka.md", "text": "- **Баренцево море** [Т][Л]. Глубина моря **320–340 м** [Т]."}, {"kind": "note", "title": "Штокмановское ГКМ", "file": "02_mestorozhdeniya_spravka.md", "text": "- Российская компания-участник — **ПАО «Газпром»** [Т]."}, {"kind": "note", "title": "Штокмановское ГКМ", "file": "02_mestorozhdeniya_spravka.md", "text": "- Газоконденсатное (ГК) [Т]. Запасы ≈ 3,9 трлн м³ газа [С]. Открыто в 1988 г. [С]. ~550–600 км от Мурманска [С]."}, {"kind": "note", "title": "Сахалинские проекты (Охотское море)", "file": "02_mestorozhdeniya_spravka.md", "text": "| Проект | Оператор | Месторождения | Платформы |"}, {"kind": "note", "title": "Сахалинские проекты (Охотское море)", "file": "02_mestorozhdeniya_spravka.md", "text": "|---|---|---|---|"}, {"kind": "note", "title": "Сахалинские проекты (Охотское море)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Сахалин-1** | ООО «Сахалин-1» (Роснефть; ранее Exxon Neftegas) | **Чайво, Одопту-море, Аркутун-Даги** [Т] | **Орлан** — Чайво (15 м, 2004); **Беркут** — Аркутун-Даги (35 м, 2014) [Л][Т]; береговые буровые **Ястреб**, Кречет [С] |"}, {"kind": "note", "title": "Сахалинские проекты (Охотское море)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Сахалин-2** | «Сахалинская энергия» (Газпром) | **Пильтун-Астохское**, **Лунское** [Т][Л] | **ПА-А «Моликпак»** (30 м, 1999), **ПА-Б** (32 м, 2008), **Лунская-А** (48 м, 2006) [Л][Т] |"}, {"kind": "note", "title": "Сахалинские проекты (Охотское море)", "file": "02_mestorozhdeniya_spravka.md", "text": "| **Сахалин-3** | Газпром | **Киринское** (первый в России **подводный добычной комплекс**) [Т], Венинский, Аяшский, Вост.-Одоптинский блоки [Л] | ПДК (без платформы) |"}, {"kind": "note", "title": "Сахалинские проекты (Охотское море)", "file": "02_mestorozhdeniya_spravka.md", "text": "- «Сахалин-1»: глубина 15 м, начало эксплуатации 2005 [Л]; «Сахалин-2»: 30–50 м, 1996 [Л]."}, {"kind": "note", "title": "Сахалинские проекты (Охотское море)", "file": "02_mestorozhdeniya_spravka.md", "text": "- **Первое в РФ освоение шельфового месторождения с берега — Чайво** [Т] (наклонно-направленные скважины, Сахалин-1). Ответ «Одопту» — неверный [Т]."}, {"kind": "note", "title": "Сахалинские проекты (Охотское море)", "file": "02_mestorozhdeniya_spravka.md", "text": "- Рекорд: ноябрь 2017, Чайво, МЛСП «Орлан» — скважина длиной по стволу 15 000 м, отход от вертикали 14 129 м [Л]."}, {"kind": "note", "title": "Карское море", "file": "02_mestorozhdeniya_spravka.md", "text": "- **Победа** — оператор **ПАО «НК Роснефть»** [Т]; открыто в 2014 г. (скважина «Университетская-1») [С]."}, {"kind": "note", "title": "Карское море", "file": "02_mestorozhdeniya_spravka.md", "text": "- **Русановское** — **газовое** месторождение (так засчитывает портал) [Т]."}, {"kind": "note", "title": "Карское море", "file": "02_mestorozhdeniya_spravka.md", "text": "- **Ленинградское** — ГКМ [Т]."}, {"kind": "note", "title": "Платформы — кратко", "file": "02_mestorozhdeniya_spravka.md", "text": "- **Каркасно-свайные** (неледостойкие, многоблочные) — 20–100 м; **гравитационные** (ледостойкие) — 20–300 м [Л]."}, {"kind": "note", "title": "Платформы — кратко", "file": "02_mestorozhdeniya_spravka.md", "text": "- Petronius (Мекс. залив) — 610 м (609,9), надводная часть 75 м, вес 43 тыс. т, 210 км от берега [Л]."}, {"kind": "note", "title": "Платформы — кратко", "file": "02_mestorozhdeniya_spravka.md", "text": "- Troll-A (Северное море) — 472 м; Hibernia (Ньюфаундлендская банка) — 224 м [Л]."}, {"kind": "note", "title": "Платформы — кратко", "file": "02_mestorozhdeniya_spravka.md", "text": "- FPSO «Turritella» — самое глубоководное месторождение, Мексиканский залив, 2900 м [Л]."}];
const STOP=new Set(["а", "бы", "в", "верно", "во", "вопрос", "вы", "выберите", "где", "для", "до", "его", "ее", "же", "за", "и", "из", "или", "их", "к", "как", "какая", "какие", "каков", "какова", "каково", "какой", "ко", "когда", "которая", "которые", "который", "ли", "мы", "на", "находится", "не", "но", "о", "об", "один", "он", "она", "они", "от", "ответ", "относится", "относятся", "по", "при", "расположено", "расположены", "с", "со", "та", "так", "также", "те", "тот", "чем", "что", "эта", "эти", "это", "этот", "я", "является", "являются"]);
function norm(t){return (t.toLowerCase().replace(/ё/g,"е").match(/[a-zа-я]+|\d+(?:[.,]\d+)?/g)||[])}
function stems(t){const o=[];for(const w of norm(t)){if(STOP.has(w))continue;
  if(/^\d/.test(w))o.push(w.replace(",","."));else o.push(w.length<=3?w:w.slice(0,5))}return o}
const TOK=DOCS.map(d=>stems(d.kind==="note"?d.title+" "+d.text:d.text));
const DF={};TOK.forEach(t=>new Set(t).forEach(s=>DF[s]=(DF[s]||0)+1));
const N=DOCS.length, AVG=TOK.reduce((a,t)=>a+t.length,0)/N;
function search(q,top=12){const qs=[...new Set(stems(q))];if(!qs.length)return[];const r=[];
  DOCS.forEach((d,i)=>{const t=TOK[i];if(!t.length)return;const tf={};t.forEach(s=>tf[s]=(tf[s]||0)+1);
    let sc=0,hit=0;for(const s of qs){if(tf[s]){hit++;const idf=Math.log(1+(N-DF[s]+.5)/(DF[s]+.5));
      sc+=idf*tf[s]*2.2/(tf[s]+1.2*(.25+.75*t.length/AVG))}}
    if(!hit)return;sc*=Math.pow(hit/qs.length,1.5);if(d.kind==="test")sc*=1.6;r.push([sc,d])});
  return r.sort((a,b)=>b[0]-a[0]).slice(0,top).map(x=>x[1])}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(s,q){let h=esc(s.replace(/\*\*/g,""));const st=[...new Set(stems(q))].filter(x=>x.length>2);
  if(!st.length)return h;const re=new RegExp("(?<![а-яёa-z0-9])("+st.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")[а-яёa-z]*","gi");
  return h.replace(re,m=>"<mark>"+m+"</mark>")}
function card(d,q){if(d.kind==="test")return `<article class="card test"><div class="meta">Банк ответов · ${d.id}</div>
  <div class="qt">${hl(d.title,q)}</div><div class="ans">${d.ans.map(a=>"<b>"+esc(a)+"</b>").join("")}</div>
  ${d.multi?'<div class="multi">Несколько ответов — отмечай только перечисленные</div>':""}
  ${d.note?`<div class="note">${hl(d.note,q)}</div>`:""}${d.status?`<div class="st">${esc(d.status)}</div>`:""}</article>`;
  return `<article class="card"><div class="sec">${esc(d.title.replace(/\*\*/g,""))}</div><div class="frag">${hl(d.text,q)}</div></article>`}
const res=document.getElementById("res"),inp=document.getElementById("q"),hint=document.getElementById("hint");
function run(){const q=inp.value.trim();
  if(!q){const all=DOCS.filter(d=>d.kind==="test");hint.textContent=`Все проверенные вопросы (${all.length}). Начни вводить слова из вопроса.`;
    res.innerHTML=all.map(d=>card(d,"")).join("");return}
  const r=search(q);hint.textContent=r.length?`Найдено: ${r.length}. Зелёные — проверены на портале.`:"";
  res.innerHTML=r.length?r.map(d=>card(d,q)).join(""):'<div class="empty">Ничего не найдено. Попробуй название месторождения, термин или число.</div>'}
inp.addEventListener("input",run);run();
</script>
