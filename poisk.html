.st{font-size:12.5px;color:var(--muted)}
.frag{white-space:pre-wrap;overflow-wrap:anywhere}
.sec{font-size:12.5px;color:var(--accent);font-weight:500}
mark{background:transparent;color:var(--accent);font-weight:700}
.empty{color:var(--muted);padding:12px 2px}

ота**"}, {"kind": "note", "title": "[photo_2] Ресурсы морской воды", "file": "01_lekcii.md", "text": "- Объём воды в океане **~1370 млн км³**. «Как освоить эти ресурсы?»"}, {"kind": "note", "title": "[photo_3] О золоте в морской воде", "file": "01_lekcii.md", "text": "Были попытки:"}, {"kind": "note", "title": "[photo_3] О золоте в морской воде", "file": "01_lekcii.md", "text": "- после Первой мировой войны **Германия** обработала **15 т** морской воды и получила всего **0,00009 г** золота;"}, {"kind": "note", "title": "[photo_3] О золоте в морской воде", "file": "01_lekcii.md", "text": "- судно **«Михаил Ломоносов»** обработало **500 т** воды и получило **0,001 г** золота;"}, {"kind": "note", "title": "[photo_3] О золоте в морской воде", "file": "01_lekcii.md", "text": "- были и другие попытки, показавшие неэффективность применяемых технологий и технических средств."}, {"kind": "note", "title": "[photo_3] О золоте в морской воде", "file": "01_lekcii.md", "text": "- Нет технологий и технических средств для освоения таких ресурсов, как золото."}, {"kind": "note", "title": "[photo_3] О золоте в морской воде", "file": "01_lekcii.md", "text": "- Обеспечение технико-технологической доступности требует широкомасштабного фундаментального и прикладного научного исследования."}, {"kind": "note", "title": "[photo_3] О золоте в морской воде", "file": "01_lekcii.md", "text": "- В морской воде Мирового океана **~70 млн т золота**."}, {"kind": "note", "title": "[photo_3] О золоте в морской воде", "file": "01_lekcii.md", "text": "- Разведанные запасы золота на суше всего **120–150 тыс. т**."}, {"kind": "note", "title": "[photo_4] Компании, осваивающие морские нефтегазовые месторождения на российском шельфе (слайд 9)", "file": "01_lekcii.md", "text": "- ПАО «Газпром»"}, {"kind": "note", "title": "[photo_4] Компании, осваивающие морские нефтегазовые месторождения на российском шельфе (слайд 9)", "file": "01_lekcii.md", "text": "- ПАО НК «Роснефть»"}, {"kind": "note", "title": "[photo_4] Компании, осваивающие морские нефтегазовые месторождения на российском шельфе (слайд 9)", "file": "01_lekcii.md", "text": "- ПАО «Лукойл»"}, {"kind": "note", "title": "[photo_4] Компании, осваивающие морские нефтегазовые месторождения на российском шельфе (слайд 9)", "file": "01_lekcii.md", "text": "- ПАО «Новатэк»"}, {"kind": "note", "title": "[photo_5] Континентальный шельф. Терминология (слайд 10)", "file": "01_lekcii.md", "text": "- Схематический разрез: Берег → **Континентальный шельф** → **Материковый склон** → **Материковое подножие** → Океан."}, {"kind": "note", "title": "[photo_5] Континентальный шельф. Терминология (слайд 10)", "file": "01_lekcii.md", "text": "- **Шельф (shelf)** в переводе с английского — **полка**, выступ, закраина, площадка, уступ суши, скалы, а также склон и мн. др."}, {"kind": "note", "title": "[photo_5] Континентальный шельф. Терминология (слайд 10)", "file": "01_lekcii.md", "text": "- В **1949 г.** один из основоположников морской геологии, американец **Ф. Шепард** предложил считать шельфом мелководные платформы и площадки террас, окаймляющие большую часть материков и имеющие сравнительно резкий перегиб поперечного профиля, определяющий переход к континентальному склону."}, {"kind": "note", "title": "[photo_5] Континентальный шельф. Терминология (слайд 10)", "file": "01_lekcii.md", "text": "- Этот перегиб назван **бровкой шельфа (shelf break)**."}, {"kind": "note", "title": "[photo_6] Определения континентального шельфа", "file": "01_lekcii.md", "text": "- **Статья 76 Конвенции ООН по морскому праву** (заключена в г. **Монтего-Бей 10.12.1982**):"}, {"kind": "note", "title": "[photo_6] Определения континентального шельфа", "file": "01_lekcii.md", "text": "континентальный шельф прибрежного государства включает морское дно и недра подводных районов, простирающихся за пределы его территориального моря на всём протяжении естественного продолжения его сухопутной территории до внешней границы подводной окраины материка или на расстояние **200 морских миль** от исходных линий, от которых отмеряется ширина территориального моря, когда внешняя граница подводной окраины материка не простирается на такое расстояние."}, {"kind": "note", "title": "[photo_6] Определения континентального шельфа", "file": "01_lekcii.md", "text": "- **С геологической точки зрения** континентальный шельф — подводное продолжение материка (континента) в сторону моря до его резкого обрыва или перехода в материковый склон."}, {"kind": "note", "title": "[photo_6] Определения континентального шельфа", "file": "01_lekcii.md", "text": "- **С международно-правовой точки зрения** континентальный шельф — морское дно, включая его недра, простирающееся от внешней границы территориального моря до фиксированных международным правом пределов, над которыми прибрежное государство осуществляет суверенные права в целях разведки и разработки его природных богатств."}, {"kind": "note", "title": "[photo_7] Зоны по Конвенции ООН по морскому праву 1982 г.", "file": "01_lekcii.md", "text": "- Полный суверенитет прибрежного государства — только **12-мильная зона** территориальных вод. Частичный суверенитет — на **200-мильную исключительную экономическую зону (ИЭЗ)**, где государство имеет суверенное право разрабатывать природные ресурсы."}, {"kind": "note", "title": "[photo_7] Зоны по Конвенции ООН по морскому праву 1982 г.", "file": "01_lekcii.md", "text": "- Территориальные воды — **12 миль (22,2 км)** от исходной линии (линия наибольшего отлива)."}, {"kind": "note", "title": "[photo_7] Зоны по Конвенции ООН по морскому праву 1982 г.", "file": "01_lekcii.md", "text": "- Прилежащая зона — **ещё 12 миль** (22,2 + 22,2 км), т.е. до 24 миль от исходной линии."}, {"kind": "note", "title": "[photo_7] Зоны по Конвенции ООН по морскому праву 1982 г.", "file": "01_lekcii.md", "text": "- ИЭЗ — **200 миль** (на схеме глубина у края 150–200 м)."}, {"kind": "note", "title": "[photo_7] Зоны по Конвенции ООН по морскому праву 1982 г.", "file": "01_lekcii.md", "text": "- Шельфовая зона — до **350 миль**. Далее — Международный район морского дна."}, {"kind": "note", "title": "[photo_7] Зоны по Конвенции ООН по морскому праву 1982 г.", "file": "01_lekcii.md", "text": "- **1 морская миля = 1,852 км**; 1 сухопутная миля = 1,61 км."}, {"kind": "note", "title": "[photo_7] Зоны по Конвенции ООН по морскому праву 1982 г.", "file": "01_lekcii.md", "text": "- ИЭЗ — район, подпадающий под действие особого правового режима. Ширина ИЭЗ не может превышать 200 морских миль, отсчитываемых от исходных линий. В ИЭЗ все государства пользуются свободами судоходства и полётов, прокладки кабелей и трубопроводов и другими правомерными видами использования моря."}, {"kind": "note", "title": "[photo_8] ИЭЗ (слайд 13)", "file": "01_lekcii.md", "text": "- Национальное воздушное пространство — над территориальными водами; над ИЭЗ — международное воздушное пространство."}, {"kind": "note", "title": "[photo_8] ИЭЗ (слайд 13)", "file": "01_lekcii.md", "text": "- Территориальные воды 12 миль (22,2 км); прилежащая зона 12 миль (22,2 км); ИЭЗ **200 морских миль (370,4 км)**; далее открытое море. 1 морская миля — 1852 м."}, {"kind": "note", "title": "[photo_8] ИЭЗ (слайд 13)", "file": "01_lekcii.md", "text": "- **Территориальные воды** — прибрежная полоса (до 12 миль), входящая в состав территории прибрежного государства, на которую распространяется его полный суверенитет (водная толща, дно, недра и воздушное пространство)."}, {"kind": "note", "title": "[photo_8] ИЭЗ (слайд 13)", "file": "01_lekcii.md", "text": "- **Прилежащая зона** — полоса моря шириной 12 миль за пределами территориального, где государство вправе останавливать, досматривать и задерживать суда-нарушители для предотвращения и наказания нарушений таможенных, фискальных, иммиграционных или санитарных правил. Суверенитет государства здесь не действует, свобода судоходства сохраняется."}, {"kind": "note", "title": "[photo_8] ИЭЗ (слайд 13)", "file": "01_lekcii.md", "text": "- **ИЭЗ** — 200 миль от территориального моря (исходных линий), где государство обладает исключительными правами на разведку, эксплуатацию и сохранение живых и неживых ресурсов водной толщи, морского дна и его недр; юрисдикция в создании искусственных островов, проведении морских научных исследований и защите морской среды."}, {"kind": "note", "title": "[photo_8] ИЭЗ (слайд 13)", "file": "01_lekcii.md", "text": "- **Права других государств в ИЭЗ** — свобода судоходства, полётов, прокладки подводных кабелей и трубопроводов при соблюдении прав прибрежного государства."}, {"kind": "note", "title": "[photo_8] ИЭЗ (слайд 13)", "file": "01_lekcii.md", "text": "- **Открытое море** — все части моря, не входящие во внутренние воды, территориальное море или ИЭЗ; не подчинено суверенитету ни одной страны (свобода для всех наций)."}, {"kind": "note", "title": "[photo_9] Основные морские нефтегазоносные бассейны и относительные уровни добычи УВ", "file": "01_lekcii.md", "text": "- Бассейны на карте: **Северное море (North Sea)**, **Мексиканский залив и Карибское море**, **Средиземное море**, **Каспийское море**, **Персидский залив**, **Западная Африка**, **Южно-Китайское море**."}, {"kind": "note", "title": "[photo_9] Основные морские нефтегазоносные бассейны и относительные уровни добычи УВ", "file": "01_lekcii.md", "text": "- Вода покрывает **71%** поверхности Земли; **13%** — шельф с глубиной до **200 м**; **60%** — глубиной более **3000 м**."}, {"kind": "note", "title": "[photo_9] Основные морские нефтегазоносные бассейны и относительные уровни добычи УВ", "file": "01_lekcii.md", "text": "- Известно более **300** нефтегазоносных бассейнов и открыто более **1500** месторождений."}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "Арктика:"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- **Штокмановское** (Баренцево море) — на карте подписано «17–19 … 2011», **Приразломное** — «320–340 … 2016». ⚠ Подписи на карте перепутаны: по тестам глубина у **Штокмановского 320–340 м**, у **Приразломного 19–20 м** (в таблице платформ photo_46 — 20 м)."}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Приямальский шельф — 2024"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- **Обско-Тазовская губа**: Северо-Каменномысское, Каменномысское-море, Чугорьяхинское и Обское газовые месторождения — 11–14 м, 2018"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Карское море, моря Лаптевых, Восточно-Сибирское, Чукотское — перспективные."}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "Юг:"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Темрюкско-Ахтарский (Азовское море) — 10 м, н.д."}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Туапсинский прогиб (Черное море) — 1000–2000 м, н.д."}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Западно-Черноморская площадь — 1700–2100 м, н.д."}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Каспийское море (Лукойл):"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- месторождение **им. Юрия Корчагина** — 11–13 м, **04.2010**"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Северо-Каспийский участок — 1–5 м"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- месторождение **им. Филановского** — 7–11 м, 2013–2014 (факт — 2016)"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Хвалынское — 25–30 м, 2016"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Центральное — 50–70 м, после 2017"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Ракушечное — 4–10 м, 2016–2017"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Сарматское — 13–30 м, 2016–2017"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- 170 км — 13–30 м, 2016–2017"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "Дальний Восток:"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — начало эксплуатации)", "file": "01_lekcii.md", "text": "- Западно-Камчатский блок — 40–400 м"}, {"kind": "note", "title": "[photo_10] Шельфовая добыча углеводородов РФ (карта; глубина моря, м — на
