<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шельф: поиск ответов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: одна узкая колонка, липкая строка поиска сверху, ниже — карточки ответов (банк) и фрагменты лекций */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --fg:#14232e; --muted:#5b6d79; --line:#d6e0e6;
  --accent:#0b5f86; --ok:#1d7a4a; --ok-bg:#e5f4ec; --warn:#8a5a00;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e171d; --surface:#15222b; --fg:#e3ecf1; --muted:#93a6b2;
  --line:#263945; --accent:#5fb6dd; --ok:#6fd39c; --ok-bg:#12301f; --warn:#e2b04f; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e171d; --surface:#15222b; --fg:#e3ecf1; --muted:#93a6b2;
  --line:#263945; --accent:#5fb6dd; --ok:#6fd39c; --ok-bg:#12301f; --warn:#e2b04f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px 12px;z-index:5;display:grid;gap:8px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
h1 span{color:var(--muted);font-weight:400}
#q{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
#q:focus{outline:none;border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
#res{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.card.test{border-left:4px solid var(--ok)}
.meta{font:500 11.5px var(--f-mono);color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.qt{font-weight:500}
.ans{display:flex;flex-wrap:wrap;gap:6px}
.ans b{background:var(--ok-bg);color:var(--ok);padding:3px 9px;border-radius:6px;font-weight:700}
.multi{font-size:12px;color:var(--warn);font-weight:500}
.note{font-size:13.5px;color:var(--fg)}
.st{font-size:12.5px;color:var(--muted)}
.frag{white-space:pre-wrap;overflow-wrap:anywhere}
.sec{font-size:12.5px;color:var(--accent);font-weight:500}
mark{background:transparent;color:var(--accent);font-weight:700}
.empty{color:var(--muted);padding:12px 2px}
</style>
<div class="wrap">
<header>
  <h1>Освоение шельфа <span>· поиск ответа</span></h1>
  <input id="q" type="search" placeholder="Слова из вопроса: «глубина Приразломное»" autocomplete="off" autofocus>
  <div class="hint" id="hint">Зелёные карточки — ответы, проверенные на портале. Остальное — лекции и справочник.</div>
</header>
<div id="res"></div>
</div>
<script>
const DOCS=/*__DATA__*/[];
const STOP=new Set(/*__STOP__*/[]);
function norm(t){return (t.toLowerCase().replace(/ё/g,"е").match(/[a-zа-я]+|\d+(?:[.,]\d+)?/g)||[])}
function stems(t){const o=[];for(const w of norm(t)){if(STOP.has(w))continue;
  if(/^\d/.test(w))o.push(w.replace(",","."));else o.push(w.length<=3?w:w.slice(0,5))}return o}
const TOK=DOCS.map(d=>stems(d.kind==="note"?d.title+" "+d.text:d.text));
const DF={};TOK.forEach(t=>new Set(t).forEach(s=>DF[s]=(DF[s]||0)+1));
const N=DOCS.length, AVG=TOK.reduce((a,t)=>a+t.length,0)/N;
function search(q,top=12){const qs=[...new Set(stems(q))];if(!qs.length)return[];const r=[];
  DOCS.forEach((d,i)=>{const t=TOK[i];if(!t.length)return;const tf={};t.forEach(s=>tf[s]=(tf[s]||0)+1);
    let sc=0,hit=0;for(const s of qs){if(tf[s]){hit++;const idf=Math.log(1+(N-DF[s]+.5)/(DF[s]+.5));
      sc+=idf*tf[s]*2.2/(tf[s]+1.2*(.25+.75*t.length/AVG))}}
    if(!hit)return;sc*=Math.pow(hit/qs.length,1.5);if(d.kind==="test")sc*=1.6;r.push([sc,d])});
  return r.sort((a,b)=>b[0]-a[0]).slice(0,top).map(x=>x[1])}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(s,q){let h=esc(s.replace(/\*\*/g,""));const st=[...new Set(stems(q))].filter(x=>x.length>2);
  if(!st.length)return h;const re=new RegExp("(?<![а-яёa-z0-9])("+st.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")[а-яёa-z]*","gi");
  return h.replace(re,m=>"<mark>"+m+"</mark>")}
function card(d,q){if(d.kind==="test")return `<article class="card test"><div class="meta">Банк ответов · ${d.id}</div>
  <div class="qt">${hl(d.title,q)}</div><div class="ans">${d.ans.map(a=>"<b>"+esc(a)+"</b>").join("")}</div>
  ${d.multi?'<div class="multi">Несколько ответов — отмечай только перечисленные</div>':""}
  ${d.note?`<div class="note">${hl(d.note,q)}</div>`:""}${d.status?`<div class="st">${esc(d.status)}</div>`:""}</article>`;
  return `<article class="card"><div class="sec">${esc(d.title.replace(/\*\*/g,""))}</div><div class="frag">${hl(d.text,q)}</div></article>`}
const res=document.getElementById("res"),inp=document.getElementById("q"),hint=document.getElementById("hint");
function run(){const q=inp.value.trim();
  if(!q){const all=DOCS.filter(d=>d.kind==="test");hint.textContent=`Все проверенные вопросы (${all.length}). Начни вводить слова из вопроса.`;
    res.innerHTML=all.map(d=>card(d,"")).join("");return}
  const r=search(q);hint.textContent=r.length?`Найдено: ${r.length}. Зелёные — проверены на портале.`:"";
  res.innerHTML=r.length?r.map(d=>card(d,q)).join(""):'<div class="empty">Ничего не найдено. Попробуй название месторождения, термин или число.</div>'}
inp.addEventListener("input",run);run();
</script>
